<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956.23 256" width="1912" height="512" role="img" aria-labelledby="t d"><title id="t">AgentCoin lockup</title><desc id="d">AgentCoin mark: two heavy corner brackets, top-left and bottom-right, whose ends angle inward to grip a solid square at the center. The square is the payment; the brackets are the escrow holding it until a verdict. Followed by the wordmark 'AgentCoin' set in Geist SemiBold, outlined (placeholder name).</desc><rect width="956.23" height="256" fill="#0E0F11"/><path fill="#F4F2EC" d="M38 116 V48 A10 10 0 0 1 48 38 H116 L134 70 H70 V134 Z M 218 140 V 208 A 10 10 0 0 1 208 218 H 140 L 122 186 H 186 V 122Z"/><path fill="#FF5A1F" d="M97 94H159A3 3 0 0 1 162 97V159A3 3 0 0 1 159 162H97A3 3 0 0 1 94 159V97A3 3 0 0 1 97 94Z"/><path fill="#F4F2EC" transform="translate(290 173) scale(0.12676)" d="M19 0 275 -710H434L690 0H554L495 -168H214L155 0ZM252 -279H457L355 -579Z M972.0 162Q902.0 162 852.0 143.0Q802.0 124 771.5 89.5Q741.0 55 729.0 10L861.0 1Q871.0 31 895.5 48.0Q920.0 65 972.0 65Q1031.0 65 1063.0 38.5Q1095.0 12 1095.0 -44V-112Q1076.0 -73 1034.0 -49.5Q992.0 -26 940.0 -26Q874.0 -26 822.5 -58.5Q771.0 -91 742.0 -149.5Q713.0 -208 713.0 -285Q713.0 -362 741.5 -420.5Q770.0 -479 821.0 -512.5Q872.0 -546 938.0 -546Q996.0 -546 1038.0 -520.0Q1080.0 -494 1099.0 -451V-534H1224.0V-47Q1224.0 21 1192.5 68.0Q1161.0 115 1104.5 138.5Q1048.0 162 972.0 162ZM970.0 -126Q1027.0 -126 1061.0 -168.5Q1095.0 -211 1096.0 -286Q1097.0 -336 1081.5 -371.5Q1066.0 -407 1037.5 -426.5Q1009.0 -446 970.0 -446Q911.0 -446 878.5 -402.5Q846.0 -359 846.0 -286Q846.0 -213 879.5 -169.5Q913.0 -126 970.0 -126Z M1573.0 12Q1493.0 12 1434.0 -22.5Q1375.0 -57 1343.0 -120.0Q1311.0 -183 1311.0 -267Q1311.0 -351 1343.0 -413.5Q1375.0 -476 1433.5 -511.0Q1492.0 -546 1570.0 -546Q1646.0 -546 1703.5 -512.0Q1761.0 -478 1792.0 -414.0Q1823.0 -350 1823.0 -260V-231H1444.0Q1448.0 -161 1482.5 -125.5Q1517.0 -90 1574.0 -90Q1617.0 -90 1645.5 -109.5Q1674.0 -129 1685.0 -164L1816.0