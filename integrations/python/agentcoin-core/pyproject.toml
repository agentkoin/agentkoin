[project]
name = "agentkoin-core"
version = "0.1.3"
description = "AgentKoin (formerly AgentCoin) router client (find, order, pay, verify). Base Sepolia testnet only; mainnet (capped beta, unaudited, opt-in escrow) is live at agentcoinhq.com but not supported by this package."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "STOS Technologies LLC" }]
dependencies = ["httpx>=0.27", "eth-account>=0.13", "eth-abi>=5", "web3>=7", "rfc8785>=0.1.4"]

[project.urls]
Homepage = "https://github.com/agentkoin/agentkoin"
Repository = "https://github.com/agentkoin/agentkoin"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentcoin_core"]

[tool.hatch.build.targets.sdist]
exclude = ["/tests", "/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
"LICENSE" = "LICENSE"

[tool.hatch.build.targets.wheel.force-include]
"LICENSE" = "LICENSE"
